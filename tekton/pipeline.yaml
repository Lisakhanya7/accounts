apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: accounts-ci
spec:
  workspaces:
    - name: source
  tasks:
    - name: test
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: test
            image: python:3.12-slim
            workingDir: $(workspaces.source.path)
            script: |
              set -eu
              pip install -r requirements.txt
              python -m unittest discover -s tests -v
      workspaces:
        - name: source
          workspace: source
